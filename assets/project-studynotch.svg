<svg xmlns="http://www.w3.org/2000/svg" width="430" height="206" viewBox="0 0 430 206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-labelledby="t">
<title id="t">studynotch: A study helper that lives in your Mac's notch. Right-click a sentence and the AI you already use answers from your course's PDFs.</title>
<style>
.pop{animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx .9s cubic-bezier(.2,.8,.2,1) both}
.type{transform-box:fill-box;transform-origin:0 50%}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes type{from{transform:scaleX(0)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="haze" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#0f2e1c"/><stop offset="1" stop-color="#0d1117"/></radialGradient><pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity=".018"/></pattern><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39d353"/><stop offset="1" stop-color="#0e4429"/></linearGradient></defs>
